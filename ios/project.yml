name: VIATracker
options:
  bundleIdPrefix: com.junxuanb.viatracker
  # The interface uses Simplified Chinese as its development language.
  developmentLanguage: zh-Hans
  # Xcode 27.2 rejects XcodeGen's duplicate folder references for local packages.
  postGenCommand: python3 ../scripts/fix-xcode-package-references.py
  deploymentTarget:
    iOS: '26.0'
packages:
  TrackerCore:
    path: ../packages/TrackerCore
settings:
  base:
    DEVELOPMENT_TEAM: 85SV63Z4H5
    SWIFT_VERSION: '6.0'
    TARGETED_DEVICE_FAMILY: '1,2'
    CURRENT_PROJECT_VERSION: '1'
    MARKETING_VERSION: '1.0.0'
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    GENERATE_INFOPLIST_FILE: NO
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
targets:
  VIATracker:
    type: application
    platform: iOS
    sources: [App, Shared]
    dependencies:
      - package: TrackerCore
      - target: VIATrackerWidgets
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.junxuanb.viatracker
        INFOPLIST_FILE: Configuration/App-Info.plist
        CODE_SIGN_ENTITLEMENTS: Configuration/App.entitlements
      configs:
        Debug:
          APNS_ENVIRONMENT: development
        Release:
          APNS_ENVIRONMENT: production
  VIATrackerWidgets:
    type: app-extension
    platform: iOS
    sources: [Widgets, Shared]
    dependencies:
      - package: TrackerCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.junxuanb.viatracker.widgets
        INFOPLIST_FILE: Configuration/Widgets-Info.plist
        CODE_SIGN_ENTITLEMENTS: Configuration/Widgets.entitlements
        SKIP_INSTALL: YES
        APPLICATION_EXTENSION_API_ONLY: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: ''
      configs:
        Debug:
          APNS_ENVIRONMENT: development
        Release:
          APNS_ENVIRONMENT: production
  VIATrackerUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [UITests]
    dependencies:
      - target: VIATracker
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.junxuanb.viatracker.uitests
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_FILE: ''
        CODE_SIGN_ENTITLEMENTS: ''
        ASSETCATALOG_COMPILER_APPICON_NAME: ''
schemes:
  VIATracker:
    build:
      targets:
        VIATracker: all
        VIATrackerWidgets: all
    run:
      config: Debug
    archive:
      config: Release
    test:
      targets: [VIATrackerUITests]
